# Perk-popularity crawl for D2 Conflux's weapon page.
#
# Every 3 hours a run checks out the app repo (public, so no token needed) at
# the APP_REF repository variable (default main) and, with this repo's
# BUNGIE_CRAWLER_API_KEY secret, spends 2 hours reading players' profiles:
# new players found through PvE matches that ended in the last 15 minutes,
# and, with up to half its reads, players already in the store that it hasn't
# read for a week. Each read gives the perks on every legendary they have
# equipped, plus their vault when it's public, and when they last played.
# Players signed in to D2 Conflux add their whole inventory: the site saves
# their weapons as they load it, and each run reads the ones saved since its
# last (POPULARITY_DATABASE_URL, a database role that can only read them).
#
# Each copy counts once, by its item instance id, for as long as its owner
# keeps playing: a player who hasn't played for 14 days drops out with their
# copies. The store (every copy and whose it is, too big for git) lists the
# players it found, so it's encrypted with the POPULARITY_STORE_KEY secret and
# kept as an asset of this repo's "copies" release. A run downloads the
# newest one, crawls and folds its crawl in, uploads the result as a new
# asset and only then deletes the older ones, so a failed upload loses
# nothing. The merge also writes perk-popularity.json, which GitHub Pages
# serves at
# https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json, so
# the app reads it without any Vercel bandwidth or functions.
#
# The same crawl tallies the armor sets players wear in raids, dungeons, GM
# Vanguard Alerts and Conquests (--armor-out): each character's latest set
# bonuses per activity type, kept 14 days in its own encrypted store (the
# armor-store-* asset of the same release) and published as
# armor-set-popularity.json for the optimizer. It's skipped on an app ref from
# before the armor tally (with a warning once a snapshot is published, which
# then stops updating). A failure anywhere in it, the crawler's tally, its
# merge or its upload, never holds up the weapons. A lost armor store isn't
# restarted quietly: once a snapshot is published, a run that finds no store
# skips armor with a warning until dispatched with bootstrap=true.
#
# A run dispatched on any branch but main, or on main with an app_ref (trying
# a crawler change), is a test: it starts from its own test-store-* asset (the
# real store, copied, the first time), writes only that, and publishes
# nothing, so trying a change can't touch what the app reads or what the next
# scheduled run starts from. That holds only on branches with this version of
# the file: a branch cut before it still runs the old one. Tests share the
# crawl concurrency group with scheduled runs (one Bungie key), so a test
# delays the next scheduled run, and GitHub keeps one pending run per group:
# a test dispatched while another test runs cancels a scheduled run waiting
# behind it. Dispatch one test at a time.
name: Crawl perk popularity

on:
  schedule:
    # Every 3 hours, a few minutes past the hour (GitHub delays top-of-the-hour runs the most).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to crawl for
        default: "120"
      recent:
        description: Find players through the matches that ended in the last this many minutes, moving along as it goes
        default: "15"
      hours:
        description: "Use a fixed window of the past this many hours instead (leave empty for recent matches)"
        default: ""
      players:
        description: Stop early once this many players have been read
        default: "500000"
      app_ref:
        description: App repo branch or commit with the crawler (default the APP_REF variable; setting it makes the run a test)
        default: ""
      bootstrap:
        description: "On main, start a new store when the release has none (otherwise the run stops, since an empty store would publish an empty snapshot; a missing armor set store only skips armor)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # The release whose assets hold the store.
  STORE_RELEASE: copies
  # A test run (see the top): dispatched off main, or on main with an app_ref. On a schedule there are no inputs.
  TEST: ${{ github.ref_name != 'main' || inputs.app_ref != '' }}
  # Store assets are named store-<run>-<id>-<attempt>.bin; a test run keeps its own, test-store-*.
  STORE_PREFIX: ${{ (github.ref_name != 'main' || inputs.app_ref != '') && 'test-store-' || 'store-' }}
  # The armor set store's assets: armor-store-<run>-<id>-<attempt>.bin, a test's test-armor-store-*.
  ARMOR_PREFIX: ${{ (github.ref_name != 'main' || inputs.app_ref != '') && 'test-armor-store-' || 'armor-store-' }}
  POPULARITY_STORE_KEY: ${{ secrets.POPULARITY_STORE_KEY }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || vars.APP_REF || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the store
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          echo "RUN=$(date -u +%FT%H)" >> "$GITHUB_ENV"
          [ -n "$STORE_PREFIX" ] || { echo "::error::STORE_PREFIX is empty."; exit 1; }
          created=false
          if ! gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --title "Copy store" \
              --notes "The perk-popularity store, encrypted: every weapon copy of the players who've played in the last 14 days. Rewritten by every crawl."
            created=true
          fi
          # The newest asset; older ones are only left behind by a run that failed before deleting them.
          newest() {
            gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
              -q "[.assets[] | select(.name | startswith(\"$1\"))] | sort_by(.createdAt) | last | .name // empty"
          }
          newest=$(newest "$STORE_PREFIX")
          # A test run with no store of its own yet starts from a copy of the real one.
          if [ -z "$newest" ] && [ "$TEST" = true ]; then newest=$(newest store-); fi
          if [ -n "$newest" ]; then
            gh release download "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --pattern "$newest" --output "$RUNNER_TEMP/store.bin"
          elif [ "$TEST" = false ] && [ "$created" = false ] && [ "$BOOTSTRAP" != true ]; then
            # The store is gone (deleted by hand, or the key changed): starting a new one here would
            # publish a near-empty snapshot. Only a run asked to bootstrap does that.
            echo "::error::The $STORE_RELEASE release has no $STORE_PREFIX* asset. Dispatch with bootstrap=true to start a new store."
            exit 1
          else
            echo "No store yet; the merge starts one."
          fi
          # The armor set store. Before any armor snapshot is published, none just starts a new one
          # (it fills within a run). After, none means it was lost: starting over would quietly swap
          # the 14-day snapshot for one run's worth, so armor sits this run out unless bootstrapped.
          armor=$(newest "$ARMOR_PREFIX")
          if [ -z "$armor" ] && [ "$TEST" = true ]; then armor=$(newest armor-store-); fi
          if [ -n "$armor" ]; then
            gh release download "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --pattern "$armor" --output "$RUNNER_TEMP/armor-store.bin"
          elif [ "$TEST" = false ] && [ -e data/armor-set-popularity.json ] && [ "$BOOTSTRAP" != true ]; then
            echo "::warning::The $STORE_RELEASE release has no $ARMOR_PREFIX* asset, though armor-set-popularity.json is published. Skipping armor this run; dispatch with bootstrap=true to start a new armor set store."
            echo "SKIP_ARMOR=true" >> "$GITHUB_ENV"
          else
            echo "No armor set store yet; the armor merge starts one."
          fi
      - name: Crawl
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
          MINUTES: ${{ inputs.minutes || '120' }}
          RECENT: ${{ inputs.recent || '15' }}
          HOURS: ${{ inputs.hours }}
          PLAYERS: ${{ inputs.players || '500000' }}
        # The rate is the crawler's own default for the crawler key: 20 requests a
        # second, slowing down for good each time Bungie throttles.
        run: |
          if [ -n "$HOURS" ]; then window=(--hours="$HOURS"); else window=(--recent="$RECENT"); fi
          store=(); if [ -e "$RUNNER_TEMP/store.bin" ]; then store=(--store="$RUNNER_TEMP/store.bin"); fi
          # The armor tally, on an app ref that has it (and a store to fold it into, see the download).
          armor=()
          if [ "$SKIP_ARMOR" = true ]; then
            echo "Crawling without the armor tally (no armor set store)."
          elif grep -q -- '"armor-out"' scripts/crawl-perk-popularity.ts; then
            armor=(--armor-out="$RUNNER_TEMP/armor-$RUN.bin")
          elif [ -e ../data/armor-set-popularity.json ]; then
            echo "::warning::This app ref's crawler has no armor tally; armor-set-popularity.json won't update this run."
          fi
          npx tsx scripts/crawl-perk-popularity.ts --players="$PLAYERS" --minutes="$MINUTES" "${window[@]}" "${store[@]}" "${armor[@]}" --out="$RUNNER_TEMP/$RUN.bin"
      - name: Read signed-in players' weapons
        working-directory: app
        # A database hiccup shouldn't cost the crawl: the merge goes on without them, and
        # the next run picks up where the store says the last one left off.
        continue-on-error: true
        env:
          POPULARITY_DATABASE_URL: ${{ secrets.POPULARITY_DATABASE_URL }}
        # Skipped until the secret is set, or on an app ref from before the script.
        run: |
          if [ -z "$POPULARITY_DATABASE_URL" ] || [ ! -f scripts/fetch-popularity-contributions.ts ]; then
            echo "Not reading signed-in players' weapons."; exit 0
          fi
          store=(); if [ -e "$RUNNER_TEMP/store.bin" ]; then store=(--store="$RUNNER_TEMP/store.bin"); fi
          npx tsx scripts/fetch-popularity-contributions.ts "${store[@]}" --out="$RUNNER_TEMP/signed-in-$RUN.bin"
      - name: Merge into the store
        working-directory: app
        run: |
          add=(--add="$RUNNER_TEMP/$RUN.bin")
          if [ -e "$RUNNER_TEMP/signed-in-$RUN.bin" ]; then add+=(--add="$RUNNER_TEMP/signed-in-$RUN.bin"); fi
          npx tsx scripts/merge-perk-popularity.ts --store="$RUNNER_TEMP/store.bin" "${add[@]}" --days=14 \
            --out=../data/perk-popularity.json
      - name: Merge armor sets
        id: armor-merge
        working-directory: app
        # The weapons go on without it.
        continue-on-error: true
        run: |
          if [ ! -e "$RUNNER_TEMP/armor-$RUN.bin" ]; then echo "No armor crawl this run."; exit 0; fi
          npx tsx scripts/merge-armor-set-popularity.ts --store="$RUNNER_TEMP/armor-store.bin" --add="$RUNNER_TEMP/armor-$RUN.bin" --days=14 \
            --out=../data/armor-set-popularity.json
      - name: Upload the store
        run: |
          [ -n "$STORE_PREFIX" ] || { echo "::error::STORE_PREFIX is empty."; exit 1; }
          # The attempt too: a re-run in the same hour after a failed push would otherwise upload the same name again.
          name="$STORE_PREFIX$RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.bin"
          cp "$RUNNER_TEMP/store.bin" "$RUNNER_TEMP/$name"
          gh release upload "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$name"
          # Only now that the new store is up: the older ones.
          gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name | startswith(\"$STORE_PREFIX\")) | select(.name != \"$name\") | .name" |
            while read -r old; do gh release delete-asset "$STORE_RELEASE" "$old" -R "$GITHUB_REPOSITORY" --yes; done
      - name: Upload the armor set store
        # Only a store this run merged a crawl into (none otherwise, or an unchanged one), and,
        # like the merge, never at the weapons' expense.
        if: steps.armor-merge.outcome == 'success'
        continue-on-error: true
        run: |
          if [ ! -e "$RUNNER_TEMP/armor-$RUN.bin" ] || [ ! -e "$RUNNER_TEMP/armor-store.bin" ]; then
            echo "No armor set store merged this run."; exit 0
          fi
          [ -n "$ARMOR_PREFIX" ] || { echo "::error::ARMOR_PREFIX is empty."; exit 1; }
          name="$ARMOR_PREFIX$RUN-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.bin"
          cp "$RUNNER_TEMP/armor-store.bin" "$RUNNER_TEMP/$name"
          gh release upload "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$name"
          # Only now that the new store is up: the older ones.
          gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name | startswith(\"$ARMOR_PREFIX\")) | select(.name != \"$name\") | .name" |
            while read -r old; do gh release delete-asset "$STORE_RELEASE" "$old" -R "$GITHUB_REPOSITORY" --yes; done
      - name: Publish
        # Not from a test: what it merged stays in its test store.
        if: env.TEST == 'false'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add perk-popularity.json
          if [ -e armor-set-popularity.json ]; then git add armor-set-popularity.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Popularity $RUN"
          # Another run may have published meanwhile (a run that waited for it checked out
          # the commit it was triggered on): land on top, this snapshot winning, since it
          # was built from the newer store.
          git pull --rebase -X theirs
          git push
