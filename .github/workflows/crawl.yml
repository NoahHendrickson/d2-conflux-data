# Weekly perk-popularity crawl for D2 Conflux's weapon page.
#
# Checks out the app repo (public, so no token needed), runs its crawler
# against Bungie's public API with this repo's BUNGIE_CRAWLER_API_KEY secret,
# and commits the snapshot here. GitHub Pages serves it at
# https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json,
# so the app reads it without any Vercel bandwidth or functions.
name: Crawl perk popularity

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      players:
        description: Players to sample
        default: "50000"
      app_ref:
        description: App repo branch or commit with the crawler
        default: main

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Crawl
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
        run: >
          npx tsx scripts/crawl-perk-popularity.ts
          --players=${{ inputs.players || '50000' }}
          --minutes=300 --rate=8 --workers=6
          --out=../data/perk-popularity.json
      - name: Publish
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add perk-popularity.json
          git diff --cached --quiet && exit 0
          git commit -m "Perk popularity $(date -u +%Y-%m-%d)"
          git push
