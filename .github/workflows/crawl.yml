# Perk-popularity crawl for D2 Conflux's weapon page.
#
# Every 3 hours a run checks out the app repo (public, so no token needed) at
# the APP_REF repository variable (default main) and, with this repo's
# BUNGIE_CRAWLER_API_KEY secret, spends 25 minutes finding players through PvE
# matches that ended in the last 15 minutes and reading the perks on every
# legendary they have equipped, plus their vault when it's public.
#
# Each copy counts once, by its item instance id: the copy store (every copy
# seen in the last 14 days, gzipped binary, too big for git) lives as an
# asset of this repo's "copies" release. A run downloads the newest one, folds
# its crawl in, uploads the result as a new asset and only then deletes the
# older ones, so a failed upload loses nothing. The merge also writes
# perk-popularity.json, which GitHub Pages serves at
# https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json, so
# the app reads it without any Vercel bandwidth or functions.
name: Crawl perk popularity

on:
  schedule:
    # Every 3 hours, a few minutes past the hour (GitHub delays top-of-the-hour runs the most).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to crawl for
        default: "25"
      recent:
        description: Find players through the matches that ended in the last this many minutes, moving along as it goes
        default: "15"
      hours:
        description: "Use a fixed window of the past this many hours instead (leave empty for recent matches)"
        default: ""
      players:
        description: Stop early once this many players have been read
        default: "50000"
      app_ref:
        description: App repo branch or commit with the crawler (default the APP_REF variable)
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # The release whose assets hold the copy store.
  STORE_RELEASE: copies

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || vars.APP_REF || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Crawl recent matches
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
          MINUTES: ${{ inputs.minutes || '25' }}
          RECENT: ${{ inputs.recent || '15' }}
          HOURS: ${{ inputs.hours }}
          PLAYERS: ${{ inputs.players || '50000' }}
        # The rate is the crawler's own default for the crawler key: 20 requests a
        # second, slowing down for good each time Bungie throttles.
        run: |
          run=$(date -u +%FT%H)
          echo "RUN=$run" >> "$GITHUB_ENV"
          if [ -n "$HOURS" ]; then window=(--hours="$HOURS"); else window=(--recent="$RECENT"); fi
          npx tsx scripts/crawl-perk-popularity.ts --players="$PLAYERS" --minutes="$MINUTES" "${window[@]}" --out="$RUNNER_TEMP/$run.bin.gz"
      - name: Download the copy store
        run: |
          if ! gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --title "Copy store" \
              --notes "The perk-popularity copy store: every weapon copy seen in the last 14 days. Rewritten by every crawl."
          fi
          # The newest asset; older ones are only left behind by a run that failed before deleting them.
          newest=$(gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q '[.assets[] | select(.name | startswith("copies-"))] | sort_by(.createdAt) | last | .name // empty')
          echo "NEWEST=$newest" >> "$GITHUB_ENV"
          if [ -n "$newest" ]; then
            gh release download "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --pattern "$newest" --output "$RUNNER_TEMP/copies.bin.gz"
          else
            echo "No copy store yet; the merge starts one."
          fi
      - name: Merge into the copy store
        working-directory: app
        run: >
          npx tsx scripts/merge-perk-popularity.ts
          --store="$RUNNER_TEMP/copies.bin.gz" --add="$RUNNER_TEMP/$RUN.bin.gz" --days=14
          --out=../data/perk-popularity.json
      - name: Upload the copy store
        run: |
          name="copies-$RUN-$GITHUB_RUN_ID.bin.gz"
          cp "$RUNNER_TEMP/copies.bin.gz" "$RUNNER_TEMP/$name"
          gh release upload "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$name"
          # Only now that the new store is up: the older ones.
          gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name | startswith(\"copies-\")) | select(.name != \"$name\") | .name" |
            while read -r old; do gh release delete-asset "$STORE_RELEASE" "$old" -R "$GITHUB_REPOSITORY" --yes; done
      - name: Publish
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add perk-popularity.json
          git diff --cached --quiet && exit 0
          git commit -m "Perk popularity $RUN"
          # Another run may have published meanwhile; land on top of it.
          git pull --rebase
          git push
