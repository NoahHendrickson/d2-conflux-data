# Perk-popularity crawl for D2 Conflux's weapon page.
#
# Every 3 hours a run checks out the app repo (public, so no token needed) at
# the APP_REF repository variable (default main) and, with this repo's
# BUNGIE_CRAWLER_API_KEY secret, spends 2 hours reading players' profiles:
# new players found through PvE matches that ended in the last 15 minutes,
# and, with up to half its reads, players already in the store that it hasn't
# read for a week. Each read gives the perks on every legendary they have
# equipped, plus their vault when it's public, and when they last played.
#
# Each copy counts once, by its item instance id, for as long as its owner
# keeps playing: a player who hasn't played for 14 days drops out with their
# copies. The store (every copy and whose it is, too big for git) lists the
# players it found, so it's encrypted with the POPULARITY_STORE_KEY secret and
# kept as an asset of this repo's "copies" release. A run downloads the
# newest one, crawls and folds its crawl in, uploads the result as a new
# asset and only then deletes the older ones, so a failed upload loses
# nothing. The merge also writes perk-popularity.json, which GitHub Pages
# serves at
# https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json, so
# the app reads it without any Vercel bandwidth or functions.
name: Crawl perk popularity

on:
  schedule:
    # Every 3 hours, a few minutes past the hour (GitHub delays top-of-the-hour runs the most).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to crawl for
        default: "120"
      recent:
        description: Find players through the matches that ended in the last this many minutes, moving along as it goes
        default: "15"
      hours:
        description: "Use a fixed window of the past this many hours instead (leave empty for recent matches)"
        default: ""
      players:
        description: Stop early once this many players have been read
        default: "500000"
      app_ref:
        description: App repo branch or commit with the crawler (default the APP_REF variable)
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # The release whose assets hold the store.
  STORE_RELEASE: copies
  # Store assets are named store-<run>-<id>.bin.
  STORE_PREFIX: store-
  POPULARITY_STORE_KEY: ${{ secrets.POPULARITY_STORE_KEY }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || vars.APP_REF || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the store
        run: |
          echo "RUN=$(date -u +%FT%H)" >> "$GITHUB_ENV"
          if ! gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --title "Copy store" \
              --notes "The perk-popularity store, encrypted: every weapon copy of the players who've played in the last 14 days. Rewritten by every crawl."
          fi
          # The newest asset; older ones are only left behind by a run that failed before deleting them.
          newest=$(gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q "[.assets[] | select(.name | startswith(\"$STORE_PREFIX\"))] | sort_by(.createdAt) | last | .name // empty")
          if [ -n "$newest" ]; then
            gh release download "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --pattern "$newest" --output "$RUNNER_TEMP/store.bin"
          else
            echo "No store yet; the merge starts one."
          fi
      - name: Crawl
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
          MINUTES: ${{ inputs.minutes || '120' }}
          RECENT: ${{ inputs.recent || '15' }}
          HOURS: ${{ inputs.hours }}
          PLAYERS: ${{ inputs.players || '500000' }}
        # The rate is the crawler's own default for the crawler key: 20 requests a
        # second, slowing down for good each time Bungie throttles.
        run: |
          if [ -n "$HOURS" ]; then window=(--hours="$HOURS"); else window=(--recent="$RECENT"); fi
          store=(); if [ -e "$RUNNER_TEMP/store.bin" ]; then store=(--store="$RUNNER_TEMP/store.bin"); fi
          npx tsx scripts/crawl-perk-popularity.ts --players="$PLAYERS" --minutes="$MINUTES" "${window[@]}" "${store[@]}" --out="$RUNNER_TEMP/$RUN.bin"
      - name: Merge into the store
        working-directory: app
        run: >
          npx tsx scripts/merge-perk-popularity.ts
          --store="$RUNNER_TEMP/store.bin" --add="$RUNNER_TEMP/$RUN.bin" --days=14
          --out=../data/perk-popularity.json
      - name: Upload the store
        run: |
          name="$STORE_PREFIX$RUN-$GITHUB_RUN_ID.bin"
          cp "$RUNNER_TEMP/store.bin" "$RUNNER_TEMP/$name"
          gh release upload "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/$name"
          # Only now that the new store is up: the older ones.
          gh release view "$STORE_RELEASE" -R "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name | startswith(\"$STORE_PREFIX\")) | select(.name != \"$name\") | .name" |
            while read -r old; do gh release delete-asset "$STORE_RELEASE" "$old" -R "$GITHUB_REPOSITORY" --yes; done
      - name: Publish
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add perk-popularity.json
          git diff --cached --quiet && exit 0
          git commit -m "Perk popularity $RUN"
          # Another run may have published meanwhile; land on top of it.
          git pull --rebase
          git push
