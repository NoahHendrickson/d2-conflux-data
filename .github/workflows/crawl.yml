# Daily perk-popularity crawl for D2 Conflux's weapon page (PvE only).
#
# Each run checks out the app repo (public, so no token needed) at the APP_REF
# repository variable (default main), samples about 20k players from the last
# 24 hours of PvE matches with this repo's BUNGIE_CRAWLER_API_KEY secret, and
# saves that day as daily/<UTC date>.json. The merge then adds up the last 7
# days into perk-popularity.json and deletes older days. GitHub Pages serves it
# at https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json, so
# the app reads it without any Vercel bandwidth or functions.
name: Crawl perk popularity

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      players:
        description: Players to sample
        default: "20000"
      hours:
        description: Hours of matches to sample from
        default: "24"
      app_ref:
        description: App repo branch or commit with the crawler (default the APP_REF variable)
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || vars.APP_REF || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Crawl the last day
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
        run: |
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
          mkdir -p ../data/daily
          npx tsx scripts/crawl-perk-popularity.ts \
            --players=${{ inputs.players || '20000' }} \
            --hours=${{ inputs.hours || '24' }} \
            --minutes=240 --rate=8 --workers=6 \
            --out=../data/daily/$(date -u +%F).json
      - name: Merge the last 7 days
        working-directory: app
        run: >
          npx tsx scripts/merge-perk-popularity.ts
          --dir=../data/daily --days=7
          --out=../data/perk-popularity.json --prune
      - name: Publish
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A daily perk-popularity.json
          git diff --cached --quiet && exit 0
          git commit -m "Perk popularity $DAY"
          git push
