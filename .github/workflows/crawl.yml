# Perk-popularity crawl for D2 Conflux's weapon page (PvE only).
#
# Every 3 hours a run checks out the app repo (public, so no token needed) at
# the APP_REF repository variable (default main) and, with this repo's
# BUNGIE_CRAWLER_API_KEY secret, spends 25 minutes sampling players from PvE
# matches that ended in the last 15 minutes, so the weapons it reads are still
# the ones they used. Each run is saved as daily/<UTC date>T<hour>.json. The
# merge then adds up the last 7 days into perk-popularity.json and deletes
# older files. GitHub Pages serves it at
# https://noahhendrickson.github.io/d2-conflux-data/perk-popularity.json, so
# the app reads it without any Vercel bandwidth or functions.
name: Crawl perk popularity

on:
  schedule:
    # Every 3 hours, a few minutes past the hour (GitHub delays top-of-the-hour runs the most).
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to crawl for
        default: "25"
      recent:
        description: Sample the matches that ended in the last this many minutes, moving along as it goes
        default: "15"
      hours:
        description: "Sample a fixed window of the past this many hours instead (leave empty for recent matches)"
        default: ""
      players:
        description: Stop early once this many players have been read
        default: "50000"
      app_ref:
        description: App repo branch or commit with the crawler (default the APP_REF variable)
        default: ""
      backfill_days:
        description: "Backfill instead: UTC dates (YYYY-MM-DD, space-separated) to crawl the 24 hours before that day's 06:00 UTC. Days with any crawl saved are skipped."
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          path: data
      - uses: actions/checkout@v4
        with:
          repository: NoahHendrickson/d2-stat-builder
          ref: ${{ inputs.app_ref || vars.APP_REF || 'main' }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the app's dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Crawl recent matches (or backfill past days)
        id: crawl
        working-directory: app
        env:
          BUNGIE_CRAWLER_API_KEY: ${{ secrets.BUNGIE_CRAWLER_API_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          MINUTES: ${{ inputs.minutes || '25' }}
          RECENT: ${{ inputs.recent || '15' }}
          HOURS: ${{ inputs.hours }}
          PLAYERS: ${{ inputs.players || '50000' }}
        # The rate is the crawler's own default for the crawler key: 20 requests a
        # second, slowing down for good each time Bungie throttles.
        run: |
          mkdir -p ../data/daily
          crawl() { npx tsx scripts/crawl-perk-popularity.ts --players="$PLAYERS" "$@"; }
          if [ -n "$BACKFILL_DAYS" ]; then
            # One day after another in this one run (separate runs would cancel
            # each other's queue slot). A day with any crawl saved is left alone.
            echo "DAY=backfill $BACKFILL_DAYS" >> "$GITHUB_ENV"
            for day in $BACKFILL_DAYS; do
              if compgen -G "../data/daily/$day*.json" > /dev/null; then
                echo "daily/$day already has a crawl; skipping."
                continue
              fi
              crawl --day="$day" --hours=24 --minutes=75 --out="../data/daily/$day.json"
              echo "crawled=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          run=$(date -u +%FT%H)
          echo "DAY=$run" >> "$GITHUB_ENV"
          if [ -e "../data/daily/$run.json" ]; then
            echo "daily/$run.json is already saved this hour; not overwriting it."
            exit 0
          fi
          if [ -n "$HOURS" ]; then
            crawl --hours="$HOURS" --minutes="$MINUTES" --out="../data/daily/$run.json"
          else
            crawl --recent="$RECENT" --minutes="$MINUTES" --out="../data/daily/$run.json"
          fi
          echo "crawled=true" >> "$GITHUB_OUTPUT"
      - name: Merge the last 7 days
        if: steps.crawl.outputs.crawled == 'true'
        working-directory: app
        run: >
          npx tsx scripts/merge-perk-popularity.ts
          --dir=../data/daily --days=7
          --out=../data/perk-popularity.json --prune
      - name: Publish
        if: steps.crawl.outputs.crawled == 'true'
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A daily perk-popularity.json
          git diff --cached --quiet && exit 0
          git commit -m "Perk popularity $DAY"
          # Another run may have published meanwhile; land on top of it.
          git pull --rebase
          git push
